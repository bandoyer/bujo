<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&amp;family=Public+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Public Sans', system-ui, sans-serif; }
    a { color: #a8722a; } a:hover { color: #8a5c20; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f6f1e6; background-image: radial-gradient(rgba(32, 29, 24, 0.09) 1px, transparent 1.1px); background-size: 22px 22px; color: #201d18; overflow: hidden;">

  <div style="display: flex; align-items: flex-start; padding: 40px 22px 0;">
    <div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2.5px; color: #8d8574;">AUGUST ▸ SEPTEMBER</div>
      <div style="font-family: 'Newsreader', Georgia, serif; font-size: 34px; font-weight: 500; font-style: italic; margin-top: 4px;">Migration</div>
    </div>
    <div style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8d8574;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 18px 22px 0;">
    <div style="flex: 1; height: 5px; background: #e6ddc8; border-radius: 3px; overflow: hidden;">
      <div style="width: 36%; height: 5px; background: #a8722a;"></div>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8d8574;">4 of 11</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 22px; min-height: 0;">

    <div style="background: #fdfaf2; border: 1px solid #e0d8c4; border-radius: 16px; padding: 28px 24px; box-shadow: 0 10px 24px rgba(32, 29, 24, 0.08), 0 2px 4px rgba(32, 29, 24, 0.05);">
      <div style="display: flex; align-items: baseline; gap: 14px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 20px;">•</span>
        <span style="font-size: 21px; font-weight: 500; line-height: 1.35;">Draft camping packing list</span>
      </div>
      <div style="display: flex; gap: 14px; margin-top: 14px; padding-left: 27px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8d8574;">logged Aug 4</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a8722a;">carried 1×</span>
      </div>
    </div>

    <div style="text-align: center; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 17px; color: #8d8574; padding: 22px 0 18px;">Still worth your time?</div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #201d18; color: #f6f1e6; border-radius: 12px; font-size: 15px; font-weight: 600;"><span style="font-family: 'JetBrains Mono', monospace;">&gt;</span> September</div>
      <div style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid #cfc7b2; border-radius: 12px; font-size: 15px; font-weight: 500;"><span style="font-family: 'JetBrains Mono', monospace;">&lt;</span> Future Log</div>
      <div style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid #cfc7b2; border-radius: 12px; font-size: 15px; font-weight: 500;"><span style="font-family: 'JetBrains Mono', monospace;">x</span> Done</div>
      <div style="height: 56px; display: flex; align-items: center; justify-content: center; border: 1.5px solid #cfc7b2; border-radius: 12px; font-size: 15px; font-weight: 500; color: #a0524a;"><span style="text-decoration: line-through;">Strike out</span></div>
    </div>

    <div style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a39a89; padding-top: 20px;">swipe → migrate · swipe ← strike</div>

  </div>

  <div style="padding: 0 22px 26px;">
    <div style="height: 48px; display: flex; align-items: center; justify-content: center; color: #8d8574; font-size: 14px; font-weight: 500;">Finish later</div>
  </div>

</div>
</x-dc>
</body>
</html>
