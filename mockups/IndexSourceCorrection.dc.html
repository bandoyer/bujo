<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bujo Index source correction</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Permanent+Marker&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --paper: #f6f1e6;
      --paper-surface: #fdfaf2;
      --paper-ink: #201d18;
      --paper-muted: #8d8574;
      --paper-faint: #a39a89;
      --paper-line: #e0d8c4;
      --paper-accent: #a8722a;
      --dark: #16161e;
      --dark-surface: #1a1b26;
      --dark-ink: #c0caf5;
      --dark-muted: #787c99;
      --dark-faint: #565f89;
      --dark-line: #2f3549;
      --dark-accent: #7aa2f7;
    }
    body {
      margin: 0;
      background: #d9d4c8;
      font-family: "Permanent Marker", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    .board {
      display: grid;
      width: 860px;
      min-height: 908px;
      grid-template-columns: repeat(2, 390px);
      gap: 32px;
      padding: 32px;
    }
    .phone {
      --background: var(--paper);
      --surface: var(--paper-surface);
      --ink: var(--paper-ink);
      --muted: var(--paper-muted);
      --faint: var(--paper-faint);
      --line: var(--paper-line);
      --accent: var(--paper-accent);
      --dot: rgba(32, 29, 24, 0.09);
      position: relative;
      display: flex;
      width: 390px;
      height: 844px;
      overflow: hidden;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 30px;
      background-color: var(--background);
      background-image: radial-gradient(var(--dot) 1px, transparent 1.1px);
      background-size: 22px 22px;
      color: var(--ink);
      box-shadow: 0 18px 45px rgba(32, 29, 24, 0.16);
    }
    .phone.dark {
      --background: var(--dark);
      --surface: var(--dark-surface);
      --ink: var(--dark-ink);
      --muted: var(--dark-muted);
      --faint: var(--dark-faint);
      --line: var(--dark-line);
      --accent: var(--dark-accent);
      --dot: rgba(192, 202, 245, 0.07);
      box-shadow: 0 18px 45px rgba(22, 22, 30, 0.35);
    }
    .page {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      padding: 28px 18px 82px;
    }
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .heading { min-width: 0; }
    h1 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 40px;
      font-weight: 400;
      line-height: 0.98;
    }
    .context {
      margin: 8px 0 0;
      color: var(--accent);
      font-size: 13px;
    }
    .action, .primary {
      display: grid;
      min-height: 44px;
      padding: 0 13px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }
    .header .action { flex: 0 0 auto; }
    .topics {
      display: grid;
      margin-top: 28px;
      border-top: 1px solid var(--line);
    }
    .topic {
      display: grid;
      min-height: 52px;
      grid-template-columns: minmax(0, 1fr) 24px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      text-decoration: none;
    }
    .topic span:first-child { overflow-wrap: anywhere; }
    .chevron { color: var(--faint); font-size: 22px; text-align: center; }
    .create-panel, .capture-panel {
      margin-top: 24px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      box-shadow: 0 10px 24px rgba(32, 29, 24, 0.08);
    }
    .label {
      display: block;
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 13px;
    }
    .field-row {
      display: flex;
      min-width: 0;
      min-height: 46px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
    }
    .field-row input {
      min-width: 0;
      flex: 1;
      padding: 0 12px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
    }
    .field-row .primary {
      border: 0;
      border-radius: 0;
      background: var(--accent);
      color: var(--surface);
    }
    .notice {
      margin: 24px 0 0;
      padding-left: 10px;
      border-left: 3px solid var(--accent);
      color: var(--accent);
      font-size: 14px;
    }
    .empty {
      display: grid;
      min-height: 156px;
      margin-top: 22px;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }
    .kind-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .kind {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--muted);
      font-family: "Permanent Marker", "JetBrains Mono", monospace;
      font-size: 20px;
    }
    .kind[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .tab-bar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      height: 66px;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--faint);
      font-size: 11px;
    }
    .tab.active { color: var(--accent); }
    .tab svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
    }
  </style>
</head>
<body>
  <main class="board">
    <section class="phone" aria-label="Index immediately contains a newly created Collection">
      <div class="page">
        <header class="header">
          <div class="heading">
            <h1>Index</h1>
            <p class="context">Your collections</p>
          </div>
          <button class="action" type="button">New Collection</button>
        </header>

        <nav class="topics" aria-label="Indexed Collections">
          <a class="topic" href="#camping"><span>Camping Trip</span><span class="chevron">›</span></a>
          <a class="topic" href="#reading"><span>Reading List</span><span class="chevron">›</span></a>
        </nav>

        <section class="create-panel" aria-label="New Collection form">
          <label class="label" for="new-topic">Topic</label>
          <div class="field-row">
            <input id="new-topic" value="Garden Plans" aria-label="Topic">
            <button class="primary" type="button">Create</button>
          </div>
        </section>
      </div>
      <nav class="tab-bar" aria-label="Primary">
        <span class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2"></circle></svg>Today</span>
        <span class="tab"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M8 3v4M16 3v4"></path></svg>Month</span>
        <span class="tab"><svg viewBox="0 0 24 24"><path d="M5 6l6 6-6 6M12 6l6 6-6 6"></path></svg>Future</span>
        <span class="tab active"><svg viewBox="0 0 24 24"><path d="M6 6h12M6 12h12M6 18h12"></path></svg>Index</span>
      </nav>
    </section>

    <section class="phone dark" id="camping" aria-label="New empty Collection already in the Index">
      <div class="page">
        <header class="header">
          <div class="heading">
            <h1>Camping Trip</h1>
            <p class="context">Collection</p>
          </div>
          <button class="action" type="button">Manage</button>
        </header>

        <p class="notice" role="status">Collection created.</p>
        <div class="empty">Nothing logged yet.</div>

        <section class="capture-panel" aria-label="Write first Collection entry">
          <div class="kind-row" aria-label="Entry kind">
            <button class="kind" type="button" aria-label="Task" aria-pressed="true">•</button>
            <button class="kind" type="button" aria-label="Event" aria-pressed="false">O</button>
            <button class="kind" type="button" aria-label="Note" aria-pressed="false">–</button>
          </div>
          <div class="field-row">
            <input aria-label="Rapid log" placeholder="Rapid log…">
            <button class="primary" type="button">Log</button>
          </div>
        </section>
      </div>
      <nav class="tab-bar" aria-label="Primary">
        <span class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2"></circle></svg>Today</span>
        <span class="tab"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M8 3v4M16 3v4"></path></svg>Month</span>
        <span class="tab"><svg viewBox="0 0 24 24"><path d="M5 6l6 6-6 6M12 6l6 6-6 6"></path></svg>Future</span>
        <span class="tab active"><svg viewBox="0 0 24 24"><path d="M6 6h12M6 12h12M6 18h12"></path></svg>Index</span>
      </nav>
    </section>
  </main>
</body>
</html>
