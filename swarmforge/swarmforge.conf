# six-mix-fable-review: experimental Sol + Grok review roster for 1.5.3a.
# Sol Max specifies, Sol High implements, Grok High cleans, Sol High
# architects, Grok High hardens, and Sol XHigh QAs. Isolated
# worktrees. Passing QA is terminal for implementation.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window specifier codex mix-specifier task --model gpt-5.6-sol -c model_reasoning_effort=max -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
window coder codex mix-coder task --model gpt-5.6-sol -c model_reasoning_effort=high -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
window cleaner grok mix-cleaner batch --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window architect codex mix-architect batch --model gpt-5.6-sol -c model_reasoning_effort=high -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
window hardener grok mix-hardener batch --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window qa codex mix-qa batch --model gpt-5.6-sol -c model_reasoning_effort=xhigh -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
