# Kamal deploy: single DO droplet, image on GHCR, TLS via kamal-proxy
# and Let's Encrypt (bujo.questlog.dev must resolve to the droplet,
# DNS-only/grey-cloud so the HTTP-01 challenge reaches the proxy).
service: bujo
image: bandoyer/bujo

servers:
  web:
    - 174.138.85.202

proxy:
  ssl: true
  host: bujo.questlog.dev

registry:
  server: ghcr.io
  username: bandoyer
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Solid Queue runs inside Puma until job volume argues otherwise.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# The SQLite databases live on a named volume so deploys don't touch them.
# Litestream (accessory below) shares the volume and streams the primary
# database to R2; cache/queue/cable are rebuildable and not replicated.
volumes:
  - "bujo_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  litestream:
    image: litestream/litestream:0.3
    host: 174.138.85.202
    cmd: replicate -config /etc/litestream.yml
    files:
      - config/litestream.yml:/etc/litestream.yml
    volumes:
      - "bujo_storage:/data"
    env:
      secret:
        - R2_ACCOUNT_ID
        - LITESTREAM_ACCESS_KEY_ID
        - LITESTREAM_SECRET_ACCESS_KEY
